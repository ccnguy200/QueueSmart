<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="QueueSmart">
  <!-- App-icon background -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#2563EB"/>

  <!-- Clock face (smart wait-time) -->
  <circle cx="42" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="42" y1="18" x2="42" y2="13.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="45.5" y2="20.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Queue: three people in line (decreasing to suggest depth) -->
  <rect x="13" y="35" width="38" height="6.5" rx="3.25" fill="#FFFFFF"/>
  <rect x="13" y="45" width="29" height="6.5" rx="3.25" fill="#FFFFFF" opacity="0.82"/>
  <rect x="13" y="55" width="20" height="6.5" rx="3.25" fill="#FFFFFF" opacity="0.62"/>
</svg>
