<!DOCTYPE html>
<html>
    <head>
        <!-- Set title for browser tab -->
        <title>Queue Status</title>

        <!-- Link style sheet for uniform design and text -->
        <link rel="stylesheet" href="../styles.css">
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart</h2>
            <!-- Navigation to other user files -->
            <nav>
                <ul>
                    <!-- Link to user dashboard screen -->
                    <li><a href="user_dashboard.html">User Dashboard</a></li>

                    <!-- Link to join queue screen -->
                    <li><a href="join_queue.html">Join Queue</a></li>

                    <!-- Link to queue status screen -->
                    <li><a href="queue_status.html">Queue Status</a></li>

                    <!-- Link to history screen -->
                    <li><a href="history.html">History</a></li>

                    <!-- Link to user calendar screen -->
                    <li><a href="user_calendar.html">View Calendar</a></li>

                    <!-- Link to login screen when user logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Queue Status Screen -->
        <!-- Note: Mock Data used -->
        <h1>Queue Status</h1>

        <!-- Feature 1: Current position and estimated wait time -->
        <div class="card">
            <h3 id="service-name">Academic Advising</h3>
            <div class="current">
                <div class="stat">
                    <div class="label">Current Position</div>
                    <div class="value" id="position">#3</div>
                </div>
                <div class="stat">
                    <div class="label">Estimated Wait Time</div>
                    <div class="value" id="wait-time">20 minutes</div>
                </div>
                <div class="stat">
                    <div class="label">Status</div>
                    <div class="value"><span id="status-badge" class="badge badge-waiting">Waiting</span></div>
                </div>
            </div>
        </div>

        <!-- Feature 2: Status updates (waiting, almost ready, served) -->
        <div class="card">
            <h3>Progress</h3>
            <!-- Steps are highlighted by renderStatus() -->
            <div class="tracker">
                <div class="step" id="step-0">Waiting</div>
                <div class="step" id="step-1">Almost Ready</div>
                <div class="step" id="step-2">Served</div>
            </div>
        </div>

        <!-- Feature 3: Status update notifications -->
        <div class="card">
            <h3>Status Updates</h3>
            <ul class="updates" id="updates-list"></ul>
        </div>

        <!-- Actions -->
        <div class="card">
            <!-- Simulates the next status change (UI only) -->
            <button class="btn" onclick="advanceStatus()">Simulate Next Update</button>

            <!-- Leave the queue -->
            <a href="user_dashboard.html" class="btn-danger">Leave Queue</a>
        </div>

        <!-- Note: Mock Data used, no backend -->
        <script>
            // Possible statuses, in order
            const statuses = ["Waiting", "Almost Ready", "Served"];

            // Average minutes per person
            const minutesPerPerson = 10;

            // Current position in the queue (mock)
            let position = 3;

            // Index into the statuses array
            let statusIndex = 0;

            // Mock status updates: [message, time]
            let updates = [
                ["You joined the Academic Advising queue.", "10:02 AM"],
                ["Your position is now #3.", "10:05 AM"]
            ];

            // Return the badge class for a status
            function badgeClass(status) {
                if (status === "Served") {
                    return "badge-served";
                }
                if (status === "Almost Ready") {
                    return "badge-ready";
                }
                return "badge-waiting";
            }

            // Update the position, wait time, badge, tracker, and updates list
            function renderStatus() {
                const status = statuses[statusIndex];

                document.getElementById("position").innerText = "#" + position;
                document.getElementById("wait-time").innerText = (position * minutesPerPerson) + " minutes";

                const badge = document.getElementById("status-badge");
                badge.innerText = status;
                badge.className = "badge " + badgeClass(status);

                // Highlight the progress steps
                for (let i = 0; i < statuses.length; i++) {
                    const step = document.getElementById("step-" + i);
                    step.className = "step";

                    if (i < statusIndex) {
                        step.className = "step done";
                    } else if (i === statusIndex) {
                        step.className = "step active";
                    }
                }

                // Build the status updates list
                const list = document.getElementById("updates-list");
                list.innerHTML = "";

                for (let i = 0; i < updates.length; i++) {
                    const item = document.createElement("li");
                    item.innerHTML = updates[i][0] + '<div class="time">' + updates[i][1] + "</div>";
                    list.appendChild(item);
                }
            }

            // Move to the next status (UI simulation)
            function advanceStatus() {
                if (statusIndex < statuses.length - 1) {
                    statusIndex = statusIndex + 1;

                    // Move up one position, but never below #1
                    position = position - 1;
                    if (position < 1) {
                        position = 1;
                    }

                    // Build the current time, e.g. 10:15 AM
                    const now = new Date();
                    let hour = now.getHours();
                    let minute = now.getMinutes();
                    let suffix = "AM";

                    if (hour >= 12) {
                        suffix = "PM";
                    }
                    if (hour > 12) {
                        hour = hour - 12;
                    }
                    if (minute < 10) {
                        minute = "0" + minute;
                    }

                    const time = hour + ":" + minute + " " + suffix;
                    updates.unshift(["Status changed to: " + statuses[statusIndex] + ".", time]);

                    renderStatus();
                } else {
                    alert("You have already been served.");
                }
            }

            renderStatus();
        </script>
    </body>
</html>
