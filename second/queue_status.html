<!DOCTYPE html>
<html>
    <head>
        <!-- Scaling for browsers on both mobile and desktop -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Set title for browser tab -->
        <title>Queue Status</title>

        <!-- Link google font 'Oswald' -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Design & Customization -->
        <style>
            /* Body design */
            body {
                font-family: 'Oswald', sans-serif;
                margin: 20px;
                background-color: #f4f4f4;
                color: #222;
            }

            /* Navigation header section */
            header {
                background-color: #1f3a5f;
                color: #fff;
                padding: 12px 20px;
                border-radius: 6px;
                margin-bottom: 20px;
            }
            header h2 {
                margin: 0 0 8px 0;
            }
            nav ul {
                list-style: none;
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
                margin: 0;
                padding: 0;
            }
            nav a {
                color: #cfe1f5;
                text-decoration: none;
                font-weight: 500;
            }
            nav a:hover {
                color: #fff;
                text-decoration: underline;
            }

            /* Feature card section */
            .card {
                background-color: #fff;
                border-radius: 6px;
                padding: 16px 20px;
                margin-bottom: 20px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
            }

            /* Status badge */
            .badge {
                display: inline-block;
                padding: 4px 12px;
                border-radius: 12px;
                font-size: 0.9em;
                font-weight: 600;
            }
            .badge-waiting {
                background-color: #e2e6eb;
                color: #333;
            }
            .badge-ready {
                background-color: #fdf0d0;
                color: #8a6100;
            }
            .badge-served {
                background-color: #d7f0dd;
                color: #1b6b35;
            }

            /* Current status section */
            .current {
                display: flex;
                flex-wrap: wrap;
                gap: 30px;
                align-items: center;
            }
            .current .stat .label {
                color: #555;
                font-size: 0.9em;
            }
            .current .stat .value {
                font-size: 1.8em;
                font-weight: 700;
            }

            /* Status progress tracker */
            .tracker {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 15px;
            }
            .step {
                flex: 1 1 120px;
                text-align: center;
                padding: 10px;
                border-radius: 6px;
                background-color: #eef2f7;
                color: #666;
            }
            .step.done {
                background-color: #d7f0dd;
                color: #1b6b35;
                font-weight: 600;
            }
            .step.active {
                background-color: #1f3a5f;
                color: #fff;
                font-weight: 600;
            }

            /* Status updates list */
            .updates {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .updates li {
                padding: 10px;
                border-bottom: 1px solid #ddd;
            }
            .updates li:last-child {
                border-bottom: none;
            }
            .updates .time {
                color: #666;
                font-size: 0.85em;
            }

            /* Button sections */
            .btn, .btn-danger {
                display: inline-block;
                border: none;
                border-radius: 4px;
                padding: 8px 16px;
                font-family: inherit;
                font-size: 0.95em;
                cursor: pointer;
                text-decoration: none;
                margin-right: 8px;
            }
            .btn {
                background-color: #1f3a5f;
                color: #fff;
            }
            .btn:hover {
                background-color: #2c5185;
            }
            .btn-danger {
                background-color: #c0392b;
                color: #fff;
            }
            .btn-danger:hover {
                background-color: #a5311f;
            }
        </style>
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart</h2>
            <!-- Navigation to other user files -->
            <nav>
                <ul>
                    <!-- Link to user dashboard screen -->
                    <li><a href="user_dashboard.html">User Dashboard</a></li>

                    <!-- Link to join queue screen -->
                    <li><a href="join_queue.html">Join Queue</a></li>

                    <!-- Link to queue status screen -->
                    <li><a href="queue_status.html">Queue Status</a></li>

                    <!-- Link to history screen -->
                    <li><a href="history.html">History</a></li>

                    <!-- Link to login screen when user logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Queue Status Screen -->
        <!-- Note: Mock data used -->
        <h1>Queue Status</h1>

        <!-- Feature 1: Current position and estimated wait time -->
        <div class="card">
            <h3 id="service-name">Academic Advising</h3>
            <div class="current">
                <div class="stat">
                    <div class="label">Current Position</div>
                    <div class="value" id="position">#3</div>
                </div>
                <div class="stat">
                    <div class="label">Estimated Wait Time</div>
                    <div class="value" id="wait-time">20 minutes</div>
                </div>
                <div class="stat">
                    <div class="label">Status</div>
                    <div class="value"><span id="status-badge" class="badge badge-waiting">Waiting</span></div>
                </div>
            </div>
        </div>

        <!-- Feature 2: Status updates (waiting, almost ready, served) -->
        <div class="card">
            <h3>Progress</h3>
            <!-- Steps are highlighted by renderStatus() -->
            <div class="tracker">
                <div class="step" id="step-0">Waiting</div>
                <div class="step" id="step-1">Almost Ready</div>
                <div class="step" id="step-2">Served</div>
            </div>
        </div>

        <!-- Feature 3: Status update notifications -->
        <div class="card">
            <h3>Status Updates</h3>
            <ul class="updates" id="updates-list"></ul>
        </div>

        <!-- Actions -->
        <div class="card">
            <!-- Simulates the next status change (UI only) -->
            <button class="btn" onclick="advanceStatus()">Simulate Next Update</button>

            <!-- Leave the queue -->
            <a href="user_dashboard.html" class="btn-danger">Leave Queue</a>
        </div>

        <!-- renderStatus(): updates position, wait time, badge, tracker, and the updates list -->
        <!-- advanceStatus(): moves to the next status (UI simulation) -->
        <!-- Note: mock data used, no backend -->
        <script>
            // Possible statuses in order
            const statuses = ["Waiting", "Almost Ready", "Served"];

            // Average minutes per person
            const minutesPerPerson = 10;

            // Current position in the queue (mock)
            let position = 3;

            // Index into the statuses array
            let statusIndex = 0;

            // Mock status update history: [message, time]
            let updates = [
                ["You joined the Academic Advising queue.", "10:02 AM"],
                ["Your position is now #3.", "10:05 AM"]
            ];

            // Return the CSS class for a status
            function badgeClass(status) {
                if (status === "Served") {
                    return "badge-served";
                }
                if (status === "Almost Ready") {
                    return "badge-ready";
                }
                return "badge-waiting";
            }

            // Rebuild the whole status screen
            function renderStatus() {
                const status = statuses[statusIndex];

                // Feature 1: position, wait time, and status badge
                document.getElementById("position").innerText = "#" + position;
                document.getElementById("wait-time").innerText = (position * minutesPerPerson) + " minutes";

                const badge = document.getElementById("status-badge");
                badge.innerText = status;
                badge.className = "badge " + badgeClass(status);

                // Feature 2: progress tracker
                for (let i = 0; i < statuses.length; i++) {
                    const step = document.getElementById("step-" + i);
                    step.className = "step";
                    if (i < statusIndex) {
                        step.className = "step done";
                    } else if (i === statusIndex) {
                        step.className = "step active";
                    }
                }

                // Feature 3: status updates list
                const list = document.getElementById("updates-list");
                list.innerHTML = "";
                updates.forEach(function (update) {
                    const item = document.createElement("li");
                    item.innerHTML = update[0] + '<div class="time">' + update[1] + "</div>";
                    list.appendChild(item);
                });
            }

            // Simulate the next status change
            function advanceStatus() {
                if (statusIndex < statuses.length - 1) {
                    statusIndex++;
                    // Move up one position, but never below #1
                    position = Math.max(1, position - 1);

                    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                    updates.unshift(["Status changed to: " + statuses[statusIndex] + ".", time]);

                    renderStatus();
                } else {
                    alert("You have already been served.");
                }
            }

            // Initial render
            renderStatus();
        </script>
    </body>
</html>
