<!DOCTYPE html>
<html>
    <head>
        <!-- Set title for browser tab -->
        <title>Now Serving</title>

        <!-- Link style sheet for uniform design and text -->
        <link rel="stylesheet" href="../styles.css">
    </head>
    <!-- Body content -->
    <body>
        <header>
            <div class="brand"><img src="../images/logo.svg" alt="QueueSmart" width="32" height="32"><h2>QueueSmart</h2></div>
            <!-- This screen is shown on a TV in the lobby, so it only links back home -->
            <nav>
                <ul>
                    <!-- Link to home screen -->
                    <li><a href="../index.html">Home</a></li>
                </ul>
            </nav>
        </header>

        <!-- Now Serving Screen -->
        <!-- Shows the queues from the backend, updated every 5 seconds -->
        <h1>Now Serving</h1>
        <p>Names are shortened to keep them private. Last updated: <span id="updated-time"></span></p>

        <!-- One card per service, added by renderDisplay() -->
        <div id="display"></div>

        <!-- script will load the services and the queue from the backend -->
        <script>            // Desk each service's queue serves at (mock data)
            const desks = {
                "Academic Advising": "Desk 1",
                "Financial Aid Office": "Desk 2",
                "Tutoring Services": "Room 105"
            };

            // Data loaded from the backend
            let services = [];
            let queue = [];

            // Load services and the queue, then build the display
            async function loadDisplay() {
                const servicesRes = await fetch('/api/services');
                const servicesData = await servicesRes.json();
                services = servicesData.services;

                const queueRes = await fetch('/api/queue/status');
                const queueData = await queueRes.json();
                queue = queueData.queue;

                renderDisplay();
            }

            // The waiting people for one service, in order
            function waitingFor(serviceName) {
                const people = [];
                for (let i = 0; i < queue.length; i++) {
                    if (queue[i].service === serviceName && queue[i].status === "waiting") {
                        people.push(queue[i]);
                    }
                }
                return people;
            }

            // Turn "Maria Lopez" into "Maria L." to keep names private
            function shortName(fullName) {
                let name = fullName;

                // An email only uses the part before the @ ("maria.lopez@uh.edu" -> "maria lopez")
                const at = name.indexOf("@");
                if (at !== -1) {
                    name = name.substring(0, at).split(".").join(" ");
                }

                const parts = name.split(" ");
                let first = parts[0].charAt(0).toUpperCase() + parts[0].substring(1);
                if (parts.length === 1) {
                    // A one-word email name ("jchen23@uh.edu") can be the whole username, so only the start is shown
                    if (at !== -1 && first.length > 3) {
                        first = first.substring(0, 3) + "***";
                    }
                    return first;
                }
                return first + " " + parts[parts.length - 1].charAt(0).toUpperCase() + ".";
            }

            // Build one card for each service
            function renderDisplay() {
                const display = document.getElementById("display");
                display.innerHTML = "";

                for (let i = 0; i < services.length; i++) {
                    const service = services[i];
                    const people = waitingFor(service.name);
                    const card = document.createElement("div");
                    card.className = "card";

                    // Closed queue with nobody left to serve
                    if (service.open === false && people.length === 0) {
                        card.innerHTML =
                            "<h3>" + service.name + "</h3>" +
                            '<p><span class="badge badge-closed">Closed</span></p>';
                    }
                    // Open but nobody waiting
                    else if (people.length === 0) {
                        card.innerHTML =
                            "<h3>" + service.name + "</h3>" +
                            '<p class="empty">No one is waiting.</p>';
                    }
                    else {
                        // The first person is being served, the next three are up next
                        let upNext = "";
                        for (let j = 1; j < people.length && j <= 3; j++) {
                            upNext = upNext + "<li>" + shortName(people[j].userName) + "</li>";
                        }
                        if (upNext === "") {
                            upNext = "<li>No one else is waiting.</li>";
                        }

                        // A closed queue still serves the people who are already waiting
                        let closedNote = "";
                        if (service.open === false) {
                            closedNote = '<p><span class="badge badge-closed">Closed</span> No new people can join.</p>';
                        }

                        card.innerHTML =
                            "<h3>" + service.name + "</h3>" +
                            closedNote +
                            '<div class="current">' +
                                '<div class="stat">' +
                                    '<div class="label">Now Serving</div>' +
                                    '<div class="value">' + shortName(people[0].userName) + "</div>" +
                                "</div>" +
                                '<div class="stat">' +
                                    '<div class="label">Please Go To</div>' +
                                    '<div class="value">' + desks[service.name] + "</div>" +
                                "</div>" +
                            "</div>" +
                            "<p><strong>Up Next:</strong></p>" +
                            "<ul>" + upNext + "</ul>" +
                            '<button class="btn-secondary" onclick="callNext(\'' + service.name + '\')">Call Next</button>';
                    }

                    display.appendChild(card);
                }

                // Show the time of the last update, e.g. 2:30 PM
                const now = new Date();
                let hour = now.getHours();
                let minute = now.getMinutes();
                let suffix = "AM";

                if (hour >= 12) {
                    suffix = "PM";
                }
                if (hour === 0) {
                    hour = 12;
                }
                if (hour > 12) {
                    hour = hour - 12;
                }
                if (minute < 10) {
                    minute = "0" + minute;
                }
                document.getElementById("updated-time").innerText = hour + ":" + minute + " " + suffix;
            }

            // Serve the next person for a service
            async function callNext(serviceName) {
                await fetch('/api/admin/queue/serve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service: serviceName })
                });
                await loadDisplay();
            }

            loadDisplay();

            // Load again every 5 seconds so the screen shows who is being called
            setInterval(loadDisplay, 5000);
        </script>
    </body>
</html>
