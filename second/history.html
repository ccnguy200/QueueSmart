<!DOCTYPE html>
<html>
    <head>
        <!-- Set title for browser tab -->
        <title>History</title>

        <!-- Link style sheet for uniform design and text -->
        <link rel="stylesheet" href="../styles.css">
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart</h2>
            <!-- Navigation to other user files -->
            <nav>
                <ul>
                    <!-- Link to user dashboard screen -->
                    <li><a href="user_dashboard.html">User Dashboard</a></li>

                    <!-- Link to join queue screen -->
                    <li><a href="join_queue.html">Join Queue</a></li>

                    <!-- Link to queue status screen -->
                    <li><a href="queue_status.html">Queue Status</a></li>

                    <!-- Link to history screen -->
                    <li><a href="history.html">History</a></li>

                    <!-- Link to user calendar screen -->
                    <li><a href="user_calendar.html">View Calendar</a></li>

                    <!-- Link to login screen when user logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- History Screen -->
        <!-- Note: Mock Data used -->
        <h1>Queue History</h1>

        <!-- Feature 1: Filter the history -->
        <div class="card">
            <h3>Filter</h3>
            <label for="outcome-filter">Outcome:</label>
            <!-- Changing the filter re-renders the table -->
            <select id="outcome-filter" onchange="renderHistory()">
                <option value="All">All</option>
                <option value="Served">Served</option>
                <option value="Left Queue">Left Queue</option>
                <option value="Missed">Missed</option>
            </select>
        </div>

        <!-- Feature 2: List of past queues joined -->
        <div class="card">
            <h3>Past Queues</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Service</th>
                        <th>Wait Time</th>
                        <th>Outcome</th>
                    </tr>
                </thead>
                <!-- Rows are added by renderHistory() -->
                <tbody id="history-body"></tbody>
            </table>
            <p class="empty" id="empty-message" style="display:none;">No records match this filter.</p>
        </div>

        <!-- Note: Mock Data used, no backend -->
        <script>
            // Mock history of past queues: date, service, wait time, and outcome
            const history = [
                { date: "2026-09-14", service: "Academic Advising", wait: 30, outcome: "Served" },
                { date: "2026-09-11", service: "Financial Aid Office", wait: 15, outcome: "Served" },
                { date: "2026-09-08", service: "Tutoring Services", wait: 20, outcome: "Left Queue" },
                { date: "2026-09-03", service: "Academic Advising", wait: 45, outcome: "Missed" },
                { date: "2026-08-29", service: "Financial Aid Office", wait: 10, outcome: "Served" },
                { date: "2026-08-25", service: "Tutoring Services", wait: 5, outcome: "Served" }
            ];

            // Return the badge markup for an outcome
            function outcomeBadge(outcome) {
                let css = "badge-left";

                if (outcome === "Served") {
                    css = "badge-served";
                } else if (outcome === "Missed") {
                    css = "badge-missed";
                }

                return '<span class="badge ' + css + '">' + outcome + "</span>";
            }

            // Build the history table for the selected filter
            function renderHistory() {
                const filter = document.getElementById("outcome-filter").value;
                const body = document.getElementById("history-body");
                const emptyMessage = document.getElementById("empty-message");

                body.innerHTML = "";
                let shown = 0;

                for (let i = 0; i < history.length; i++) {
                    const record = history[i];

                    // "All" shows every record, otherwise match the outcome
                    if (filter === "All" || record.outcome === filter) {
                        const row = document.createElement("tr");
                        row.innerHTML =
                            "<td>" + record.date + "</td>" +
                            "<td>" + record.service + "</td>" +
                            "<td>" + record.wait + " min</td>" +
                            "<td>" + outcomeBadge(record.outcome) + "</td>";

                        body.appendChild(row);
                        shown = shown + 1;
                    }
                }

                // Show the empty message when nothing matched
                if (shown === 0) {
                    emptyMessage.style.display = "block";
                } else {
                    emptyMessage.style.display = "none";
                }
            }

            renderHistory();
        </script>
    </body>
</html>
