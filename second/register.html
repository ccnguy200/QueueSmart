<!DOCTYPE html>
<html>
    <head>
        <title>Register</title> 
        <link rel="stylesheet" href="../styles.css">      
    </head>
    <!-- When the page is shown (also after pressing Back), adminRegister function called -->
    <body onpageshow="adminRegister()">
        <div class="feature">
            <h1>Register</h1>
            <!-- Pop-up messages that match the site style -->
            <script src="../popup.js"></script>
            <script src="../script.js" defer></script>
            <form onsubmit="return register()" method="POST">
                <p>
                    <label for="first">Username:</label>
                    <input type="email" name="first" id="first" size="10" required placeholder="example@email.com">
                </p>
                <p>
                    <label for="second">Password:</label>
                    <input type="password" id="second" name="second" size="10" minlength="8" maxlength="15" required placeholder="password">
                </p>
                <p>
                    <label for="role">Account Type:</label>
                    <select id="role" name="role" onChange="adminRegister()">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </p>

                <!-- Only shows for admin -->
                 <div id="adminReg" style="display:none;">
                    <p>
                        <label for="cardNumber">Card Number:</label>
                        <input type="text" id="cardNumber" name="cardNumber" size="20" maxlength="16" placeholder="1234567890123456">
                    </p>
                    <p>
                        <label for="cardExpiry">Expiry (MM/YY):</label>
                        <input type="text" id="cardExpiry" name="cardExpiry" size="10" maxlength="5" placeholder="MM/YY">
                    </p>
                    <p>
                        <label for="cardCVV">CVV:</label>
                        <input type="text" id="cardCVV" name="cardCVV" size="5" maxlength="3" placeholder="123">
                    </p>
                </div>

                <p>
                    <button class="btn" type="submit">Register</button>
                </p>
            </form>
            <p><a href="../index.html">Back to Home</a></p>
        </div>

        <p><button class="btn-secondary" onclick="resetData()">Reset All Users</button></p>
    </body>
</html>
