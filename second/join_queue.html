<!DOCTYPE html>
<html>
    <head>
        <!-- Set title -->
        <title>Join Queue</title>

        <!-- Link style sheet for uniform design and text -->
        <link rel="stylesheet" href="../styles.css">

        <!-- Pop-up messages that match the site style -->
        <script src="../popup.js"></script>
    </head>
    <!-- When the page is shown (also after pressing Back), updateWaitTime and showLocationStatus functions called -->
    <body onpageshow="updateWaitTime(); showLocationStatus()">
        <header>
            <h2>QueueSmart</h2>
            <!-- Navigation to other files -->
            <nav>
                <ul>
                    <!-- Link to user dashboard screen -->
                    <li><a href="user_dashboard.html">User Dashboard</a></li>

                    <!-- Link to location screen -->
                    <li><a href="user_location.html">Location</a></li>

                    <!-- Link to join queue screen -->
                    <li><a href="join_queue.html">Join Queue</a></li>
                    
                    <!-- Link to queue status screen -->
                    <li><a href="queue_status.html">Queue Status</a></li>

                    <!-- Link to history screen -->
                    <li><a href="history.html">History</a></li>

                    <!-- Link to user calendar screen -->
                    <li><a href="user_calendar.html">View Calendar</a></li>

                    <!-- Link to login screen when user logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Join Queue Screen -->
        <!-- Note: Mock data used -->
        <h1>Join a Queue</h1>

        <!-- Features: select service, view estimated wait time, and join or leave a queue -->
        <div class="card">
            <!-- Link to queue.html when after joining a queue -->
            <!-- When submitted, handleJoinQueue function called -->
            <form id="join-form" onsubmit="return handleJoinQueue(event)">

                <!-- Feature 1: Select a service -->
                <div class="form-group">
                    <label for="service">Select Service: <span style="color:red;">*</span></label>
                    <!-- When service selected, updateWaitTime and showLocationStatus functions called -->
                    <select id="service" name="service" required onchange="updateWaitTime(); showLocationStatus()">
                        <option value="" disabled selected>-- Please Select a Service --</option>
                        <option value="Advising">Academic Advising</option>
                        <option value="Financial Aid">Financial Aid Office</option>
                        <option value="Tutoring">Tutoring Services</option>
                    </select>
                </div>

                <!-- Location Feature: user must check their location before joining -->
                <p>
                    <span id="location-status"></span>
                    <a id="location-link" href="user_location.html">Check Location</a>
                </p>

                <!-- Feature 2: View estimated wait time + price for queue -->
                <div class="info-box">
                    <p style="margin: 0;"><strong>Estimated Wait Time:</strong> <span id="est-wait">Select a service above</span></p>
                    <p style="margin: 5px 0 0 0;"><strong>Fee to Join Queue:</strong> <span id="service-fee">$0.00</span></p>
                    <p style="margin: 5px 0 0 0;"><strong>Spots Left:</strong> <span id="spots-left">-</span></p>
                </div>

                <!-- Calendar Feature: User can view time slots and join a queue from calendar -->
                <h3>Schedule Service</h3>
                <!-- User selects date first -->
                <div class="form-group">
                    <label for="queue-date">Select Date: <span style="color:red;">*</span></label>
                    <input type="date" id="queue-date" name="queue-date" required>
                </div>

                <!-- User selects time slot next -->
                <div class="form-group">
                    <label for="queue-time">Select Time Slot: <span style="color:red;">*</span></label>
                    <input type="time" id="queue-time" name="queue-time" required>
                </div>

                <!-- Payment Feature: User will input CC information to pay for for service -->
                <h3>Payment Details</h3>
                <!-- Note: card inputs have no name so card info is not shown in the URL -->
                <!-- User inputs card name first -->
                <div class="form-group">
                    <label for="card-name">Cardholder Name: <span style="color:red;">*</span></label>
                    <input type="text" id="card-name" placeholder="ex. Mary Jane" maxlength="50" required>
                </div>
                
                <!-- User inputs card num next -->
                <div class="form-group">
                    <label for="card-number">Card Number: <span style="color:red;">*</span></label>
                    <input type="text" id="card-number" placeholder="ex. 1234567898765432" maxlength="16" required>
                </div>

                <!-- User inputs exp date next -->
                <div class="form-group">
                    <label for="exp-date">Expiration Date: <span style="color:red;">*</span></label>
                    <input type="text" id="exp-date" placeholder="ex. MM/YY" maxlength="5" required>
                </div>

                <!-- User inputs cvv num next -->
                <div class="form-group">
                    <label for="cvv">CVV: <span style="color:red;">*</span></label>
                    <input type="password" id="cvv" placeholder="ex. 123" maxlength="3" required>
                </div>

                <!-- Form error message -->
                <p id="form-error" style="color:#c0392b; display:none;"></p>

                <!-- Feature 3: Join or leave a queue -->
                <div class="form-group">
                    <!-- Option 1: Join queue (old error message is hidden first) -->
                    <button type="submit" class="btn" onclick="clearError()">Confirm and Join Queue</button>

                    <!-- Option 2: Leave queue -->
                    <a href="user_dashboard.html" class="btn-danger">Leave Queue</a>
                </div>

            </form>
        </div>

        <!-- updateWaitTime(): will display estimated wait time for selected service by the user + fee to join -->
        <!-- Note: mock data used -->
        <script>
            // Location Feature: user_location.html sends ?service=...&location=ok
            const params = new URLSearchParams(window.location.search);
            let checkedService = "";
            if (params.get("location") === "ok") {
                checkedService = params.get("service");
            }

            // Select the service the location was checked for
            if (["Academic Advising", "Financial Aid Office", "Tutoring Services"].includes(checkedService)) {
                document.getElementById("service").value = checkedService;
            }
            else {
                checkedService = "";
            }

            // Each person can only be in one queue at a time
            // Note: mock data, the user is already in the Academic Advising queue
            const currentQueue = "Academic Advising";

            // true after the user agrees to leave their current queue
            let switchConfirmed = false;

            // Queue size, size limit, and open/closed for each service
            // Note: mock data, same as the admin screens
            const queueSize = { "Academic Advising": 4, "Financial Aid Office": 2, "Tutoring Services": 0 };
            const maxQueueSize = { "Academic Advising": 10, "Financial Aid Office": 8, "Tutoring Services": 5 };
            const queueOpen = { "Academic Advising": true, "Financial Aid Office": true, "Tutoring Services": false };

            function updateWaitTime() {
                const serviceSelected = document.getElementById("service").value;
                const waitTime = document.getElementById("est-wait");
                const queueFee = document.getElementById("service-fee");
                const spotsLeft = document.getElementById("spots-left");

                // Show how many spots are left (or that the queue is closed)
                if (serviceSelected === "") {
                    spotsLeft.innerText = "-";
                }
                else if (queueOpen[serviceSelected] === false) {
                    spotsLeft.innerText = "This queue is closed right now";
                }
                else {
                    spotsLeft.innerText = (maxQueueSize[serviceSelected] - queueSize[serviceSelected]) + " of " + maxQueueSize[serviceSelected];
                }

                if (serviceSelected === "Academic Advising") {
                    waitTime.innerText = "30 minutes";
                    queueFee.innerText = "$20.00";
                }
                else if (serviceSelected === "Financial Aid Office") {
                    waitTime.innerText = "24 minutes";
                    queueFee.innerText = "$15.00";
                }
                else if (serviceSelected === "Tutoring Services") {
                    waitTime.innerText = "5 minutes";
                    queueFee.innerText = "$10.00";
                }
                else {
                    waitTime.innerText = "Select a service above";
                    queueFee.innerText = "$0.00";
                }
            }

            // showLocationStatus(): shows if the location was checked for the selected service
            function showLocationStatus() {
                const service = document.getElementById("service").value;
                const status = document.getElementById("location-status");
                const link = document.getElementById("location-link");

                if (service === currentQueue) {
                    status.innerText = "You are already in the Academic Advising queue.";
                    status.style.color = "#c0392b";
                    link.style.display = "none";
                }
                else if (checkedService !== "" && service === checkedService) {
                    status.innerText = "Location checked. You are close enough to join this queue.";
                    status.style.color = "green";
                    link.style.display = "none";
                }
                else {
                    status.innerText = "Please check your location for this service before joining.";
                    status.style.color = "#c0392b";
                    link.style.display = "inline";
                    link.href = "user_location.html?service=" + encodeURIComponent(service);
                }
            }

            // checkForm(): checks the location, date and payment details before joining the queue
            function checkForm() {
                const service = document.getElementById("service").value;
                const queueDate = document.getElementById("queue-date").value;
                const queueTime = document.getElementById("queue-time").value;
                const cardName = document.getElementById("card-name").value.trim();
                const cardNumber = document.getElementById("card-number").value;
                const expDate = document.getElementById("exp-date").value;
                const cvv = document.getElementById("cvv").value;

                // The user cannot join a queue they are already in
                if (service === currentQueue) {
                    return showError("You are already in the Academic Advising queue.");
                }

                // The queue must be open and not full
                if (queueOpen[service] === false) {
                    return showError("This queue is closed right now.");
                }
                if (queueSize[service] >= maxQueueSize[service]) {
                    return showError("This queue is full. Please try again later.");
                }

                // Location must be checked for this service first
                if (checkedService === "" || service !== checkedService) {
                    return showError("Please check your location for this service before joining.");
                }

                // Date cannot be in the past
                const parts = queueDate.split("-");
                const chosenDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                if (chosenDate < today) {
                    return showError("Please select today or a future date.");
                }

                // If the date is today, the time slot cannot be earlier than now
                if (chosenDate.getTime() === today.getTime()) {
                    const timeParts = queueTime.split(":");
                    const chosenMinutes = Number(timeParts[0]) * 60 + Number(timeParts[1]);
                    const nowMinutes = now.getHours() * 60 + now.getMinutes();
                    if (chosenMinutes < nowMinutes) {
                        return showError("Please select a time slot later than now.");
                    }
                }

                // Cardholder name must be at least 2 characters
                if (cardName.length < 2) {
                    return showError("Cardholder Name must be at least 2 characters.");
                }

                // Card number must be exactly 16 digits
                if (cardNumber.length !== 16 || !isAllDigits(cardNumber)) {
                    return showError("Card Number must be 16 digits (numbers only).");
                }

                // Expiration date must look like MM/YY
                const month = expDate.substring(0, 2);
                const year = expDate.substring(3, 5);
                if (expDate.length !== 5 || expDate[2] !== "/" || !isAllDigits(month) || !isAllDigits(year)) {
                    return showError("Expiration Date must be in MM/YY format.");
                }

                // Month must be between 01 and 12
                if (Number(month) < 1 || Number(month) > 12) {
                    return showError("Expiration month must be between 01 and 12.");
                }

                // Card cannot be expired
                const thisMonth = today.getMonth() + 1;
                const thisYear = today.getFullYear() - 2000;
                if (Number(year) < thisYear || (Number(year) === thisYear && Number(month) < thisMonth)) {
                    return showError("This card has expired.");
                }

                // CVV must be exactly 3 digits
                if (cvv.length !== 3 || !isAllDigits(cvv)) {
                    return showError("CVV must be 3 digits.");
                }

                // Each person can only be in one queue at a time
                // Ask first, and send the form only if the user clicks Yes
                if (!switchConfirmed) {
                    showConfirm("You are already in the Academic Advising queue. Leave it and join this queue instead?", confirmSwitch);
                    return false;
                }

                clearError();
                return true;
            }

            // confirmSwitch(): the user said yes, so send the form
            function confirmSwitch() {
                switchConfirmed = true;
                // handleJoinQueue submits to Express route, will dispatch event instead of submitting form
                document.getElementById("join-form").dispatchEvent(new Event('submit', { cancelable: true }));
            }

            // handleJoinQueue(): will submit form data to backend
            async function handleJoinQueue(event) {
                event.preventDefault();

                if (!checkForm()) {
                    return false;
                }

                const payload = {
                    userName: document.getElementById("card-name").value.trim(),
                    service: document.getElementById("service").value,
                    queueDate: document.getElementById("queue-date").value,
                    queueTime: document.getElementById("queue-time").value,
                    cardName: document.getElementById("card-name").value.trim(),
                    cardNumber: document.getElementById("card-number").value,
                    expDate: document.getElementById("exp-date").value,
                    cvv: document.getElementById("cvv").value
                };

                try {
                    const response = await fetch('/api/queue/join', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        alert("Successfully joined the queue!");
                        window.location.href = "queue_status.html";
                    } else {
                        showError(data.message || "Failed to join queue.");
                    }
                } catch (err) {
                    showError("Server Error. Could not connect to server.");
                }

                return false;
            }

            // isAllDigits(): returns true if the text only has the numbers 0-9
            function isAllDigits(text) {
                for (let i = 0; i < text.length; i++) {
                    if (text[i] < "0" || text[i] > "9") {
                        return false;
                    }
                }
                return true;
            }

            // showError(): shows a validation error
            function showError(message) {
                const error = document.getElementById("form-error");
                error.innerText = message;
                error.style.display = "block";
                return false;
            }

            // clearError(): hides the validation error
            function clearError() {
                const error = document.getElementById("form-error");
                error.innerText = "";
                error.style.display = "none";
            }
        </script>

    </body>
</html>
