<!DOCTYPE html>
<html>
    <head>
        <!-- Set title for browser tab -->
        <title>Service Management</title>

        <!-- Link style sheet for uniform design and text -->
        <link rel="stylesheet" href="../styles.css">
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart &mdash; Admin</h2>
            <!-- Navigation to other admin files -->
            <nav>
                <ul>
                    <!-- Link to admin dashboard screen -->
                    <li><a href="admin_dashboard.html">Admin Dashboard</a></li>

                    <!-- Link to service management screen -->
                    <li><a href="service_management.html">Service Management</a></li>

                    <!-- Link to queue management screen -->
                    <li><a href="queue_management.html">Queue Management</a></li>

                    <!-- Link to calendar screen -->
                    <li><a href="admin_calendar.html">View Calendar</a></li>

                    <!-- Link to login screen when admin logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Service Management Screen -->
        <!-- Note: Mock Data used -->
        <h1>Service Management</h1>

        <!-- Feature 1: Create or edit a service -->
        <div class="card">
            <h3 id="form-title">Create a Service</h3>

            <!-- onsubmit calls saveService() -->
            <form id="service-form" onsubmit="saveService(event)" novalidate>

                <!-- Service Name: required, max 100 characters -->
                <div class="form-group">
                    <label for="service-name">Service Name: <span class="required">*</span></label>
                    <input type="text" id="service-name" name="service-name" maxlength="100" required>
                    <p class="hint">Required, maximum 100 characters.</p>
                </div>

                <!-- Description: required -->
                <div class="form-group">
                    <label for="service-desc">Description: <span class="required">*</span></label>
                    <textarea id="service-desc" name="service-desc" required></textarea>
                </div>

                <!-- Expected Duration: required, in minutes -->
                <div class="form-group">
                    <label for="service-duration">Expected Duration (minutes): <span class="required">*</span></label>
                    <input type="number" id="service-duration" name="service-duration" min="1" max="480" step="1" required>
                    <p class="hint">Required, between 1 and 480 minutes.</p>
                </div>

                <!-- Priority Level: required, low / medium / high -->
                <div class="form-group">
                    <label for="service-priority">Priority Level: <span class="required">*</span></label>
                    <select id="service-priority" name="service-priority" required>
                        <option value="" disabled selected>-- Please Select a Priority --</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <!-- Form error message -->
                <p id="form-error" style="color:#c0392b; display:none;"></p>

                <!-- Option 1: Save the service -->
                <button type="submit" class="btn" id="save-btn">Save Service</button>

                <!-- Option 2: Cancel an edit -->
                <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <!-- Feature 2: Existing services -->
        <div class="card">
            <h3>Existing Services</h3>
            <table>
                <thead>
                    <tr>
                        <th>Service Name</th>
                        <th>Description</th>
                        <th>Duration</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <!-- Rows are added by renderServices() -->
                <tbody id="services-body"></tbody>
            </table>
        </div>

        <!-- Note: Mock Data used, no backend -->
        <script>
            // Mock services
            let services = [
                {
                    id: 1,
                    name: "Academic Advising",
                    description: "Talk to an advisor about course selection.",
                    duration: 30,
                    priority: "High"
                },
                {
                    id: 2,
                    name: "Financial Aid Office",
                    description: "Help with FAFSA, scholarships, and aid questions.",
                    duration: 15,
                    priority: "Medium"
                },
                {
                    id: 3,
                    name: "Tutoring Services",
                    description: "One-on-one tutoring for selected courses.",
                    duration: 5,
                    priority: "Low"
                }
            ];

            // The service being edited (null means create mode)
            let editingId = null;

            // Build the services table
            function renderServices() {
                const body = document.getElementById("services-body");
                body.innerHTML = "";

                for (let i = 0; i < services.length; i++) {
                    const service = services[i];
                    const row = document.createElement("tr");

                    row.innerHTML =
                        "<td>" + service.name + "</td>" +
                        "<td>" + service.description + "</td>" +
                        "<td>" + service.duration + " min</td>" +
                        "<td>" + priorityBadge(service.priority) + "</td>" +
                        '<td class="actions">' +
                            '<button class="btn-secondary" onclick="editService(' + service.id + ')">Edit</button>' +
                            '<button class="btn-danger" onclick="deleteService(' + service.id + ')">Delete</button>' +
                        "</td>";

                    body.appendChild(row);
                }
            }

            // Return the badge markup for a priority level
            function priorityBadge(priority) {
                const level = priority.toLowerCase();
                return '<span class="badge badge-' + level + '">' + priority + "</span>";
            }

            // Validate the form and create or update a service
            function saveService(event) {
                event.preventDefault();

                const name = document.getElementById("service-name").value.trim();
                const description = document.getElementById("service-desc").value.trim();
                const durationText = document.getElementById("service-duration").value;
                const duration = Number(durationText);
                const priority = document.getElementById("service-priority").value;

                // Client-side validation
                if (name === "") {
                    return showError("Service Name is required.");
                }
                if (name.length > 100) {
                    return showError("Service Name must be 100 characters or fewer.");
                }
                if (description === "") {
                    return showError("Description is required.");
                }
                if (durationText === "" || isNaN(duration) || duration < 1 || duration > 480) {
                    return showError("Expected Duration must be between 1 and 480 minutes.");
                }
                if (priority === "") {
                    return showError("Please select a Priority Level.");
                }

                clearError();

                if (editingId === null) {
                    // Create a new service with the next available id
                    let newId = 1;
                    for (let i = 0; i < services.length; i++) {
                        if (services[i].id >= newId) {
                            newId = services[i].id + 1;
                        }
                    }

                    services.push({
                        id: newId,
                        name: name,
                        description: description,
                        duration: duration,
                        priority: priority
                    });
                } else {
                    // Update the service being edited
                    for (let i = 0; i < services.length; i++) {
                        if (services[i].id === editingId) {
                            services[i].name = name;
                            services[i].description = description;
                            services[i].duration = duration;
                            services[i].priority = priority;
                        }
                    }
                }

                renderServices();
                resetForm();
            }

            // Load a service into the form for editing
            function editService(id) {
                let service = null;

                for (let i = 0; i < services.length; i++) {
                    if (services[i].id === id) {
                        service = services[i];
                    }
                }

                if (service === null) {
                    return;
                }

                document.getElementById("service-name").value = service.name;
                document.getElementById("service-desc").value = service.description;
                document.getElementById("service-duration").value = service.duration;
                document.getElementById("service-priority").value = service.priority;

                editingId = id;
                document.getElementById("form-title").innerText = "Edit Service";
                document.getElementById("save-btn").innerText = "Update Service";

                clearError();
                window.scrollTo(0, 0);
            }

            // Remove a service after confirmation
            function deleteService(id) {
                if (!confirm("Delete this service? This cannot be undone.")) {
                    return;
                }

                const remaining = [];
                for (let i = 0; i < services.length; i++) {
                    if (services[i].id !== id) {
                        remaining.push(services[i]);
                    }
                }
                services = remaining;

                // If the deleted service was being edited, reset the form
                if (editingId === id) {
                    resetForm();
                }

                renderServices();
            }

            // Return the form to create mode
            function resetForm() {
                document.getElementById("service-form").reset();
                editingId = null;
                document.getElementById("form-title").innerText = "Create a Service";
                document.getElementById("save-btn").innerText = "Save Service";
                clearError();
            }

            // Show a validation error
            function showError(message) {
                const error = document.getElementById("form-error");
                error.innerText = message;
                error.style.display = "block";
                return false;
            }

            // Hide the validation error
            function clearError() {
                const error = document.getElementById("form-error");
                error.innerText = "";
                error.style.display = "none";
            }

            renderServices();
        </script>
    </body>
</html>
