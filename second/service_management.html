<!DOCTYPE html>
<html>
    <head>
        <!-- Scaling for browsers on both mobile and desktop -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Set title for browser tab -->
        <title>Service Management</title>

        <!-- Link google font 'Oswald' -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Design & Customization -->
        <style>
            /* Body design */
            body {
                font-family: 'Oswald', sans-serif;
                margin: 20px;
                background-color: #f4f4f4;
                color: #222;
            }

            /* Navigation header section */
            header {
                background-color: #1f3a5f;
                color: #fff;
                padding: 12px 20px;
                border-radius: 6px;
                margin-bottom: 20px;
            }
            header h2 {
                margin: 0 0 8px 0;
            }
            nav ul {
                list-style: none;
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
                margin: 0;
                padding: 0;
            }
            nav a {
                color: #cfe1f5;
                text-decoration: none;
                font-weight: 500;
            }
            nav a:hover {
                color: #fff;
                text-decoration: underline;
            }

            /* Feature card section */
            .card {
                background-color: #fff;
                border-radius: 6px;
                padding: 16px 20px;
                margin-bottom: 20px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
            }

            /* Form section */
            .form-group {
                margin-bottom: 14px;
            }
            label {
                display: block;
                font-weight: 500;
                margin-bottom: 4px;
            }
            input, select, textarea {
                font-family: inherit;
                font-size: 1em;
                padding: 7px;
                width: 100%;
                max-width: 420px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            textarea {
                resize: vertical;
                min-height: 70px;
            }
            .required {
                color: #c0392b;
            }
            .hint {
                font-size: 0.85em;
                color: #666;
                margin: 4px 0 0 0;
            }

            /* Table section */
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }
            th, td {
                text-align: left;
                padding: 10px;
                border-bottom: 1px solid #ddd;
                vertical-align: top;
            }
            th {
                background-color: #eef2f7;
            }
            tr:hover td {
                background-color: #fafbfc;
            }

            /* Priority badges */
            .badge {
                display: inline-block;
                padding: 3px 10px;
                border-radius: 12px;
                font-size: 0.85em;
                font-weight: 600;
            }
            .badge-low {
                background-color: #d7f0dd;
                color: #1b6b35;
            }
            .badge-medium {
                background-color: #fdf0d0;
                color: #8a6100;
            }
            .badge-high {
                background-color: #f6d7d7;
                color: #97231f;
            }

            /* Button sections */
            .btn, .btn-secondary, .btn-danger {
                display: inline-block;
                border: none;
                border-radius: 4px;
                padding: 7px 14px;
                font-family: inherit;
                font-size: 0.95em;
                cursor: pointer;
                text-decoration: none;
            }
            .btn {
                background-color: #1f3a5f;
                color: #fff;
            }
            .btn:hover {
                background-color: #2c5185;
            }
            .btn-secondary {
                background-color: #e2e6eb;
                color: #333;
            }
            .btn-secondary:hover {
                background-color: #cfd5dd;
            }
            .btn-danger {
                background-color: #c0392b;
                color: #fff;
            }
            .btn-danger:hover {
                background-color: #a5311f;
            }
            .actions button {
                margin-right: 6px;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart &mdash; Admin</h2>
            <!-- Navigation to other admin files -->
            <nav>
                <ul>
                    <!-- Link to admin dashboard screen -->
                    <li><a href="admin_dashboard.html">Admin Dashboard</a></li>

                    <!-- Link to service management screen -->
                    <li><a href="service_management.html">Service Management</a></li>

                    <!-- Link to queue management screen -->
                    <li><a href="queue_management.html">Queue Management</a></li>

                    <!-- Link to login screen when admin logs out -->
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Service Management Screen -->
        <!-- Note: Mock data used -->
        <h1>Service Management</h1>

        <!-- Feature 1: Create or edit a service -->
        <div class="card">
            <h3 id="form-title">Create a Service</h3>

            <!-- onsubmit calls saveService(); client-side validation is required -->
            <form id="service-form" onsubmit="saveService(event)" novalidate>

                <!-- Service Name: required, max 100 characters -->
                <div class="form-group">
                    <label for="service-name">Service Name: <span class="required">*</span></label>
                    <input type="text" id="service-name" name="service-name" maxlength="100" required>
                    <p class="hint">Required, maximum 100 characters.</p>
                </div>

                <!-- Description: required -->
                <div class="form-group">
                    <label for="service-desc">Description: <span class="required">*</span></label>
                    <textarea id="service-desc" name="service-desc" required></textarea>
                </div>

                <!-- Expected Duration: required, positive number of minutes -->
                <div class="form-group">
                    <label for="service-duration">Expected Duration (minutes): <span class="required">*</span></label>
                    <input type="number" id="service-duration" name="service-duration" min="1" max="480" step="1" required>
                    <p class="hint">Required, between 1 and 480 minutes.</p>
                </div>

                <!-- Priority Level: required, low / medium / high -->
                <div class="form-group">
                    <label for="service-priority">Priority Level: <span class="required">*</span></label>
                    <select id="service-priority" name="service-priority" required>
                        <option value="" disabled selected>-- Please Select a Priority --</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <!-- Form error message area -->
                <p id="form-error" style="color:#c0392b; display:none;"></p>

                <!-- Option 1: Save the service -->
                <button type="submit" class="btn" id="save-btn">Save Service</button>

                <!-- Option 2: Cancel an edit and reset the form -->
                <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <!-- Feature 2: Existing services -->
        <div class="card">
            <h3>Existing Services</h3>
            <table>
                <thead>
                    <tr>
                        <th>Service Name</th>
                        <th>Description</th>
                        <th>Duration</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <!-- Service rows are generated by renderServices() -->
                <tbody id="services-body"></tbody>
            </table>
        </div>

        <!-- renderServices(): builds the service table -->
        <!-- saveService(): validates and creates/updates a service -->
        <!-- Note: mock data used, no backend -->
        <script>
            // Mock services
            let services = [
                {
                    id: 1,
                    name: "Academic Advising",
                    description: "Talk to an advisor about course selection.",
                    duration: 30,
                    priority: "High"
                },
                {
                    id: 2,
                    name: "Financial Aid Office",
                    description: "Help with FAFSA, scholarships, and aid questions.",
                    duration: 15,
                    priority: "Medium"
                },
                {
                    id: 3,
                    name: "Tutoring Services",
                    description: "One-on-one tutoring for selected courses.",
                    duration: 5,
                    priority: "Low"
                }
            ];

            // Tracks the service being edited (null means "create" mode)
            let editingId = null;

            // Rebuild the services table
            function renderServices() {
                const body = document.getElementById("services-body");
                body.innerHTML = "";

                services.forEach(function (service) {
                    const row = document.createElement("tr");

                    row.innerHTML =
                        "<td>" + service.name + "</td>" +
                        "<td>" + service.description + "</td>" +
                        "<td>" + service.duration + " min</td>" +
                        "<td>" + priorityBadge(service.priority) + "</td>" +
                        '<td class="actions">' +
                            '<button class="btn-secondary" onclick="editService(' + service.id + ')">Edit</button>' +
                            '<button class="btn-danger" onclick="deleteService(' + service.id + ')">Delete</button>' +
                        "</td>";

                    body.appendChild(row);
                });
            }

            // Return the badge markup for a priority level
            function priorityBadge(priority) {
                const level = priority.toLowerCase();
                return '<span class="badge badge-' + level + '">' + priority + "</span>";
            }

            // Validate the form and create or update the service
            function saveService(event) {
                event.preventDefault();

                const nameInput = document.getElementById("service-name");
                const descInput = document.getElementById("service-desc");
                const durationInput = document.getElementById("service-duration");
                const priorityInput = document.getElementById("service-priority");

                const name = nameInput.value.trim();
                const description = descInput.value.trim();
                const duration = Number(durationInput.value);
                const priority = priorityInput.value;

                // Client-side validation
                if (name === "") {
                    return showError("Service Name is required.");
                }
                if (name.length > 100) {
                    return showError("Service Name must be 100 characters or fewer.");
                }
                if (description === "") {
                    return showError("Description is required.");
                }
                if (durationInput.value === "" || isNaN(duration) || duration < 1 || duration > 480) {
                    return showError("Expected Duration must be between 1 and 480 minutes.");
                }
                if (priority === "") {
                    return showError("Please select a Priority Level.");
                }

                clearError();

                if (editingId === null) {
                    // Create a new service
                    const newId = services.length ? Math.max.apply(null, services.map(function (s) { return s.id; })) + 1 : 1;
                    services.push({ id: newId, name: name, description: description, duration: duration, priority: priority });
                } else {
                    // Update the existing service
                    const service = services.find(function (s) { return s.id === editingId; });
                    service.name = name;
                    service.description = description;
                    service.duration = duration;
                    service.priority = priority;
                }

                renderServices();
                resetForm();
            }

            // Load a service into the form for editing
            function editService(id) {
                const service = services.find(function (s) { return s.id === id; });
                if (!service) {
                    return;
                }

                document.getElementById("service-name").value = service.name;
                document.getElementById("service-desc").value = service.description;
                document.getElementById("service-duration").value = service.duration;
                document.getElementById("service-priority").value = service.priority;

                editingId = id;
                document.getElementById("form-title").innerText = "Edit Service";
                document.getElementById("save-btn").innerText = "Update Service";

                clearError();
                window.scrollTo(0, 0);
            }

            // Remove a service after confirmation
            function deleteService(id) {
                if (!confirm("Delete this service? This cannot be undone.")) {
                    return;
                }
                services = services.filter(function (s) { return s.id !== id; });

                // If the deleted service was being edited, reset the form
                if (editingId === id) {
                    resetForm();
                }
                renderServices();
            }

            // Return the form to "create" mode
            function resetForm() {
                document.getElementById("service-form").reset();
                editingId = null;
                document.getElementById("form-title").innerText = "Create a Service";
                document.getElementById("save-btn").innerText = "Save Service";
                clearError();
            }

            // Show a validation error message
            function showError(message) {
                const error = document.getElementById("form-error");
                error.innerText = message;
                error.style.display = "block";
                return false;
            }

            // Hide the validation error message
            function clearError() {
                const error = document.getElementById("form-error");
                error.innerText = "";
                error.style.display = "none";
            }

            // Initial render
            renderServices();
        </script>
    </body>
</html>
