<!DOCTYPE html>
<html>
    <head>
        <!-- Scaling for browsers on both mobile and desktop -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Set title for browser tab -->
        <title>Login</title>

        <!-- Link google font 'Oswald' -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Design & Customization -->
        <style>
            /* Body design */
            body {
                font-family: 'Oswald', sans-serif;
                margin: 20px;
                background-color: #f4f4f4;
                color: #222;
            }

            /* Navigation header section */
            header {
                background-color: #1f3a5f;
                color: #fff;
                padding: 12px 20px;
                border-radius: 6px;
                margin-bottom: 20px;
            }
            header h2 {
                margin: 0 0 8px 0;
            }
            nav ul {
                list-style: none;
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
                margin: 0;
                padding: 0;
            }
            nav a {
                color: #cfe1f5;
                text-decoration: none;
                font-weight: 500;
            }
            nav a:hover {
                color: #fff;
                text-decoration: underline;
            }

            /* Feature card section */
            .card {
                background-color: #fff;
                border-radius: 6px;
                padding: 16px 20px;
                margin-bottom: 20px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
                max-width: 480px;
            }

            /* Form section */
            .form-group {
                margin-bottom: 14px;
            }
            label {
                display: block;
                font-weight: 500;
                margin-bottom: 4px;
            }
            input {
                font-family: inherit;
                font-size: 1em;
                padding: 7px;
                width: 100%;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .hint {
                font-size: 0.85em;
                color: #666;
                margin: 4px 0 0 0;
            }

            /* Button sections */
            .btn {
                display: inline-block;
                border: none;
                border-radius: 4px;
                padding: 8px 16px;
                font-family: inherit;
                font-size: 0.95em;
                cursor: pointer;
                text-decoration: none;
                background-color: #1f3a5f;
                color: #fff;
            }
            .btn:hover {
                background-color: #2c5185;
            }
            .btn-secondary {
                display: inline-block;
                border: none;
                border-radius: 4px;
                padding: 8px 16px;
                font-family: inherit;
                font-size: 0.95em;
                cursor: pointer;
                text-decoration: none;
                background-color: #e2e6eb;
                color: #333;
            }
            .btn-secondary:hover {
                background-color: #cfd5dd;
            }
        </style>
    </head>
    <!-- Body content -->
    <body>
        <header>
            <h2>QueueSmart</h2>
            <!-- Navigation to home and registration -->
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="admin_dashboard.html">Admin Portal</a></li>
                </ul>
            </nav>
        </header>

        <!-- Login Screen -->
        <!-- Note: Mock data used, no backend -->
        <h1>Login</h1>

        <div class="card">
            <!-- HERE: login currently does nothing, action needs to be changed -->
            <form action="" method="GET">
                <div class="form-group">
                    <label for="email">Username (email):</label>
                    <input type="email" name="email" id="email" minlength="6" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="secret">Password:</label>
                    <input type="password" id="secret" name="secret" minlength="8" maxlength="15" required>
                    <p class="hint">8 to 15 characters.</p>
                </div>

                <div class="form-group">
                    <button class="btn">Submit</button>
                    <a href="../index.html" class="btn-secondary">Back to Home</a>
                </div>
            </form>

            <!-- Link to the registration screen -->
            <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </body>
</html>
