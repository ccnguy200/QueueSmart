<!DOCTYPE html>
<html>
    <head>
        <title>Login</title> 
        <link rel="stylesheet" href="../styles.css">      
    </head>
    <body>
        <div class="feature">
            <h1>Login</h1>
            <script src="../script.js" defer></script>
            <form onsubmit="return login()" method="POST">
                <p>
                    <label for="email">Username:</label>
                    <input type="email" name="email" id="email" size="10" required>
                </p>
                <p>
                    <label for="secret">Password:</label>
                    <input type="password" id="secret" name="secret" size="10" minlength="8" maxlength="15" required>
                </p>
                
                <p>
                    <button class="btn" type="submit">Submit</button>
                </p>
            </form>
            
            <a href="../index.html">Back to Home</a>

        </div>

        <div class="feature" style="font-size: 3; color: darkred">
            <p><button class="btn-secondary" onclick="resetData()">Reset All Users</button></p>
            <em>TEST ACCOUNTS - MOCK DATA:</em>
            <ul><strong>User:</strong>
                <li>Username: user@email.com</li>
                <li>Password: password</li>
            </ul>
            <ul><strong>Admin:</strong>
                <li>Username: admin@email.com</li>
                <li>Password: password</li>
            </ul>
        </div>

    </body>
</html>
